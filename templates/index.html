<!DOCTYPE html>
<html>
<head>
    <title>검사 결과</title>
</head>
<body>

<h1>AWS 검사 결과</h1>

<p>전체: {{ summary.total_checks }}</p>
<p>PASS: {{ summary.pass_count }}</p>
<p>FAIL: {{ summary.fail_count }}</p>
<p>Score: {{ summary.security_score }}</p>

<hr>

{% for r in results %}
    <div style="border:1px solid black; margin:10px; padding:10px;">
        <h3>{{ r.item_name }}</h3>
        상태: {{ r.status }}
    </div>
{% endfor %}

<br>
<a href="/logout">로그아웃</a>

</body>
</html>
