  good_condition: "라우팅 테이블이 서비스 목적에 맞게 필요한 경로만 포함하는 경우 양호로 판단한다."
  bad_condition: "불필요한 인터넷 경로 또는 목적이 불분명한 라우팅 정책이 존재하는 경우 취약으로 판단한다."
