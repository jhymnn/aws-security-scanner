    - "퍼블릭 서브넷과 프라이빗 서브넷 구성을 재점검한다."
  verification_steps:
    - "불필요한 인터넷 게이트웨이 연결이 제거되었는지 확인한다."
    - "인터넷 경로가 필요한 서브넷에만 존재하는지 확인한다."
  source:
    document: "SK쉴더스 2024 클라우드 보안 가이드 AWS"
