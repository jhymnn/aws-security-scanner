  importance: "상"
  description: "보안 그룹에서 모든 IP 또는 모든 포트가 허용되면 외부에서 불필요한 접근이 가능해질 수 있다."
  good_condition: "필요한 포트와 신뢰 가능한 IP 대역만 허용된 경우 양호로 판단한다."
  bad_condition: "0.0.0.0/0 또는 ::/0에 대해 불필요하게 전체 포트 또는 주요 포트가 허용된 경우 취약으로 판단한다."
  remediation_steps:
