  good_condition: "네트워크 서비스 정책이 업무 담당자에게 최소 권한으로 부여된 경우 양호로 판단한다."
  bad_condition: "네트워크 서비스에 대한 과도한 변경 권한이 불필요한 사용자에게 부여된 경우 취약으로 판단한다."
  remediation_steps:
