"1.1":
  category: "계정 관리"
  title: "사용자 계정 관리"
  importance: "상"
  description: "AWS 리소스 접근 권한은 IAM 사용자, 그룹, 역할에 연결된 권한 정책에 따라 결정되므로 불필요한 계정과 과도한 권한을 관리해야 한다."
  good_condition: "관리자 권한을 보유한 다수 계정이 존재하지 않고 불필요한 계정이 없는 경우 양호로 판단한다."
  bad_condition: "관리자 권한을 보유한 다수 계정이 존재하거나 불필요한 계정이 존재하는 경우 취약으로 판단한다."
  remediation_steps:
    - "IAM 콘솔에서 전체 사용자 목록을 확인한다."
    - "퇴직자, 휴직자, 테스트 계정, 협력사 공용 계정 등 불필요한 계정을 식별한다."
    - "불필요한 계정을 삭제하거나 비활성화한다."
    - "AdministratorAccess 등 과도한 권한이 부여된 사용자를 검토한다."
    - "업무에 필요한 최소 권한 정책으로 조정한다."
  verification_steps:
    - "IAM 사용자 목록에서 불필요한 계정이 제거되었는지 확인한다."
    - "관리자 권한 보유 계정 수가 최소화되었는지 확인한다."
  source:
    document: "SK쉴더스 2024 클라우드 보안 가이드 AWS"
    section: "1.1 사용자 계정 관리"

"1.2":
  category: "계정 관리"
  title: "IAM 사용자 계정 단일화 관리"
  importance: "상"
  description: "IAM 계정은 사용자 식별과 책임 추적을 위해 1인 1계정 원칙으로 관리해야 한다."
  good_condition: "IAM 사용자 계정을 1인 1계정으로 사용하고 있는 경우 양호로 판단한다."
  bad_condition: "한 명의 담당자가 여러 IAM 계정을 사용하거나 공용 계정을 사용하는 경우 취약으로 판단한다."
  remediation_steps:
    - "IAM 사용자 목록을 확인한다."
    - "동일 사용자가 여러 계정을 보유하고 있는지 확인한다."
    - "공용 계정 또는 목적이 불분명한 계정을 식별한다."
    - "불필요한 계정을 삭제하고 사용자별 단일 계정으로 정리한다."
    - "계정 생성 정책에 1인 1계정 원칙을 반영한다."
  verification_steps:
    - "사용자별 IAM 계정이 하나로 관리되는지 확인한다."
    - "공용 계정 또는 중복 계정이 제거되었는지 확인한다."
  source:
    document: "SK쉴더스 2024 클라우드 보안 가이드 AWS"
    section: "1.2 IAM 사용자 계정 단일화 관리"

"1.3":
  category: "계정 관리"
  title: "IAM 사용자 계정 식별 관리"
  importance: "중"
  description: "IAM 사용자 계정은 이름, 이메일, 부서 등 식별 가능한 정보를 태그로 관리하여 계정 소유자와 사용 목적을 명확히 해야 한다."
  good_condition: "사용자 정보가 IAM 사용자 태그에 설정되어 있는 경우 양호로 판단한다."
  bad_condition: "사용자 정보가 IAM 사용자 태그에 설정되어 있지 않은 경우 취약으로 판단한다."
  remediation_steps:
    - "IAM 콘솔에서 사용자 목록을 확인한다."
    - "각 사용자의 태그 정보를 확인한다."
    - "이름, 이메일, 부서, 담당 업무 등 식별 정보를 태그로 추가한다."
    - "소유자 정보가 불명확한 계정은 담당자를 확인한다."
    - "계정 생성 시 필수 태그 입력 기준을 마련한다."
  verification_steps:
    - "IAM 사용자별 태그에 소유자 정보가 입력되어 있는지 확인한다."
    - "식별 불가능한 계정이 남아 있지 않은지 확인한다."
  source:
    document: "SK쉴더스 2024 클라우드 보안 가이드 AWS"
    section: "1.3 IAM 사용자 계정 식별 관리"

"1.4":
  category: "계정 관리"
  title: "IAM 그룹 사용자 계정 관리"
  importance: "중"
  description: "IAM 그룹은 사용자 권한을 일괄 관리하는 단위이므로 그룹별 권한과 소속 사용자를 적절히 관리해야 한다."
  good_condition: "IAM 그룹에 포함된 사용자 중 불필요한 계정이 존재하지 않는 경우 양호로 판단한다."
  bad_condition: "IAM 그룹에 불필요한 사용자 계정이 포함되어 있는 경우 취약으로 판단한다."
  remediation_steps:
    - "IAM 콘솔에서 그룹 목록을 확인한다."
    - "각 그룹에 연결된 정책과 소속 사용자를 확인한다."
    - "업무와 무관한 사용자를 그룹에서 제거한다."
    - "그룹 권한이 업무 목적에 맞는지 검토한다."
    - "그룹별 사용자 현황을 주기적으로 점검한다."
  verification_steps:
    - "그룹 내 불필요한 사용자가 제거되었는지 확인한다."
    - "그룹 권한이 최소 권한 원칙에 맞게 설정되었는지 확인한다."
  source:
    document: "SK쉴더스 2024 클라우드 보안 가이드 AWS"
    section: "1.4 IAM 그룹 사용자 계정 관리"

"1.5":
  category: "계정 관리"
  title: "Key Pair 접근 관리"
  importance: "상"
  description: "EC2 인스턴스 접근 시 일반 패스워드 방식보다 Key Pair 기반 접근을 사용하여 보안성을 강화해야 한다."
  good_condition: "Key Pair를 통해 EC2 인스턴스에 접근하는 경우 양호로 판단한다."
  bad_condition: "Key Pair가 아닌 일반 패스워드로 EC2 인스턴스에 접근하는 경우 취약으로 판단한다."
  remediation_steps:
    - "EC2 콘솔에서 Key Pair를 생성하거나 기존 키를 확인한다."
    - "EC2 인스턴스 생성 시 Key Pair를 등록한다."
    - "패스워드 기반 원격 접속 사용 여부를 점검한다."
    - "불필요한 패스워드 인증을 비활성화한다."
    - "접근에 사용되는 Key Pair를 담당자 기준으로 관리한다."
  verification_steps:
    - "EC2 인스턴스 접속이 Key Pair 기반으로 수행되는지 확인한다."
    - "패스워드 기반 접속이 허용되어 있지 않은지 확인한다."
  source:
    document: "SK쉴더스 2024 클라우드 보안 가이드 AWS"
    section: "1.5 Key Pair 접근 관리"

"1.6":
  category: "계정 관리"
  title: "Key Pair 보관 관리"
  importance: "상"
  description: "Key Pair 파일은 EC2 인스턴스 접근에 사용되므로 공개 위치나 다수 접근 가능한 공간에 보관하면 무단 접근 위험이 발생한다."
  good_condition: "Key Pair 파일이 쉽게 유추하거나 접근할 수 없는 안전한 공간에 보관된 경우 양호로 판단한다."
  bad_condition: "Key Pair 파일이 퍼블릭 S3, 공용 디렉터리 등 다수 접근 가능한 위치에 보관된 경우 취약으로 판단한다."
  remediation_steps:
    - "Key Pair 파일의 저장 위치를 확인한다."
    - "퍼블릭 S3, 공유 폴더, 공개 저장소 등에 키 파일이 존재하는지 점검한다."
    - "공개된 위치에 있는 Key Pair 파일을 즉시 제거한다."
    - "필요 시 노출 가능성이 있는 Key Pair를 폐기하고 재발급한다."
    - "키 파일 접근 권한을 최소 인원으로 제한한다."
  verification_steps:
    - "Key Pair 파일이 안전한 저장소에 보관되어 있는지 확인한다."
    - "퍼블릭 접근 가능한 위치에 키 파일이 없는지 확인한다."
  source:
    document: "SK쉴더스 2024 클라우드 보안 가이드 AWS"
    section: "1.6 Key Pair 보관 관리"

"1.7":
  category: "권한 관리"
  title: "Admin Console 관리자 정책 관리"
  importance: "중"
  description: "최고 관리자 권한을 가진 계정은 모든 AWS 서비스에 접근할 수 있으므로 일상적인 서비스 운영 용도로 사용하는 것은 위험하다."
  good_condition: "Admin Console 계정을 서비스 용도로 사용하지 않는 경우 양호로 판단한다."
  bad_condition: "Admin Console 계정을 서비스 용도로 사용하는 경우 취약으로 판단한다."
  remediation_steps:
    - "IAM 사용자 및 정책 목록을 확인한다."
    - "AdministratorAccess 정책이 부여된 계정을 식별한다."
    - "업무상 최고 권한이 필요한 계정인지 검토한다."
    - "불필요한 관리자 권한을 제거한다."
    - "업무 역할에 맞는 최소 권한 정책으로 변경한다."
  verification_steps:
    - "불필요한 AdministratorAccess 정책이 제거되었는지 확인한다."
    - "관리자 권한 계정이 최소한으로 유지되는지 확인한다."
  source:
    document: "SK쉴더스 2024 클라우드 보안 가이드 AWS"
    section: "1.7 Admin Console 관리자 정책 관리"

"1.8":
  category: "계정 관리"
  title: "Admin Console 계정 Access Key 활성화 및 사용주기 관리"
  importance: "상"
  description: "Access Key는 CLI와 API 접근에 사용되는 인증수단이며 유출 시 전체 리소스 접근 위험이 발생할 수 있으므로 활성화 여부와 사용주기를 관리해야 한다."
  good_condition: "Admin Console 계정에 Access Key가 존재하지 않고 IAM 사용자 Access Key 사용 주기가 기준 이내인 경우 양호로 판단한다."
  bad_condition: "Admin Console 계정에 Access Key가 존재하거나 IAM 사용자 Access Key 사용 주기가 기준을 초과한 경우 취약으로 판단한다."
  remediation_steps:
    - "보안 자격 증명 메뉴에서 Access Key 목록을 확인한다."
    - "Root 또는 Admin Console 계정의 Access Key가 존재하면 삭제한다."
    - "IAM 사용자 Access Key 생성일과 마지막 사용일을 확인한다."
    - "장기간 미사용 또는 기준을 초과한 Access Key를 비활성화하거나 교체한다."
    - "Access Key 교체 주기와 관리 기준을 수립한다."
  verification_steps:
    - "Root/Admin 계정에 Access Key가 남아 있지 않은지 확인한다."
    - "IAM 사용자 Access Key가 기준 주기 내에서 관리되는지 확인한다."
  source:
    document: "SK쉴더스 2024 클라우드 보안 가이드 AWS"
    section: "1.8 Admin Console 계정 Access Key 활성화 및 사용주기 관리"

"1.9":
  category: "계정 관리"
  title: "MFA (Multi-Factor Authentication) 설정"
  importance: "중"
  description: "MFA는 비밀번호 외 추가 인증 수단을 요구하여 계정 탈취 위험을 줄이는 보안 기능이다."
  good_condition: "MFA가 활성화되어 있거나 조직 인증 체계를 통해 추가 인증이 적용되는 경우 양호로 판단한다."
  bad_condition: "MFA가 활성화되어 있지 않은 경우 취약으로 판단한다."
  remediation_steps:
    - "IAM 콘솔에서 사용자 또는 루트 계정의 보안 자격 증명 메뉴로 이동한다."
    - "멀티 팩터 인증 장치 할당을 선택한다."
    - "가상 MFA 앱 또는 보안 키를 등록한다."
    - "등록된 MFA 장치가 정상 동작하는지 확인한다."
    - "관리자 계정과 중요 계정에 우선 적용한다."
  verification_steps:
    - "IAM 사용자별 MFA 장치가 연결되어 있는지 확인한다."
    - "Root 계정에도 MFA가 활성화되어 있는지 확인한다."
  source:
    document: "SK쉴더스 2024 클라우드 보안 가이드 AWS"
    section: "1.9 MFA 설정"

"1.10":
  category: "계정 관리"
  title: "AWS 계정 패스워드 정책 관리"
  importance: "중"
  description: "IAM 사용자 비밀번호는 길이, 복잡도, 만료 주기, 재사용 제한 등의 정책을 통해 안전하게 관리해야 한다."
  good_condition: "IAM 계정 비밀번호 정책이 설정되어 있고 조직 기준을 만족하는 경우 양호로 판단한다."
  bad_condition: "비밀번호 정책이 설정되어 있지 않거나 기준을 만족하지 않는 경우 취약으로 판단한다."
  remediation_steps:
    - "IAM 콘솔에서 계정 설정 또는 암호 정책 메뉴로 이동한다."
    - "최소 비밀번호 길이를 설정한다."
    - "대문자, 소문자, 숫자, 특수문자 요구 조건을 설정한다."
    - "비밀번호 만료 기간과 재사용 방지 정책을 설정한다."
    - "변경된 정책이 IAM 사용자에게 적용되는지 확인한다."
  verification_steps:
    - "IAM 비밀번호 정책이 활성화되어 있는지 확인한다."
    - "복잡도와 만료 주기가 보안 기준에 맞는지 확인한다."
  source:
    document: "SK쉴더스 2024 클라우드 보안 가이드 AWS"
    section: "1.10 AWS 계정 패스워드 정책 관리"

"1.11":
  category: "계정 관리"
  title: "EKS 사용자 관리"
  importance: "상"
  description: "EKS 사용자 접근 권한은 클러스터 리소스 접근과 직접 연결되므로 불필요한 사용자와 과도한 권한을 관리해야 한다."
  good_condition: "EKS 접근 사용자가 업무 목적에 맞게 관리되고 불필요한 사용자가 없는 경우 양호로 판단한다."
  bad_condition: "불필요한 EKS 사용자 또는 과도한 권한을 가진 사용자가 존재하는 경우 취약으로 판단한다."
  remediation_steps:
    - "EKS 클러스터 접근 사용자 및 역할을 확인한다."
    - "aws-auth ConfigMap 또는 접근 정책을 확인한다."
    - "불필요한 사용자와 역할을 제거한다."
    - "업무별 최소 권한으로 RBAC 권한을 조정한다."
    - "퇴직자, 테스트 계정, 공용 계정 접근 여부를 점검한다."
  verification_steps:
    - "EKS 접근 목록에서 불필요한 사용자가 제거되었는지 확인한다."
    - "사용자별 권한이 최소 권한으로 설정되어 있는지 확인한다."
  source:
    document: "SK쉴더스 2024 클라우드 보안 가이드 AWS"
    section: "1.11 EKS 사용자 관리"

"1.12":
  category: "계정 관리"
  title: "EKS 서비스 어카운트 관리"
  importance: "중"
  description: "EKS 서비스 어카운트는 Pod가 AWS 리소스에 접근할 때 사용될 수 있으므로 불필요하거나 과도한 권한을 가진 서비스 어카운트를 제한해야 한다."
  good_condition: "서비스 어카운트가 업무 목적에 따라 최소 권한으로 관리되는 경우 양호로 판단한다."
  bad_condition: "불필요한 서비스 어카운트 또는 과도한 권한을 가진 서비스 어카운트가 존재하는 경우 취약으로 판단한다."
  remediation_steps:
