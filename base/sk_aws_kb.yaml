  good_condition: "인스턴스 서비스 정책이 최소 권한 원칙에 따라 설정된 경우 양호로 판단한다."
  bad_condition: "인스턴스 서비스에 과도한 권한 또는 불필요한 정책이 부여된 경우 취약으로 판단한다."
  remediation_steps:
