    - "VPC, Security Group, NACL, Route Table 변경 권한을 가진 사용자를 식별한다."
    - "불필요한 네트워크 변경 권한을 제거한다."
    - "운영 담당자와 조회 담당자의 권한을 분리한다."
    - "변경 권한은 승인된 관리자에게만 부여한다."
  verification_steps:
